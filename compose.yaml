services:
  sncr-console:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SNCR_PORT:-18767}:8080"
    environment:
      SNCR_ORIGIN: "http://localhost:${SNCR_PORT:-18767}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; req=urllib.request.Request('http://127.0.0.1:8080/health', headers={'Host': os.environ['SNCR_ORIGIN'].split('//')[1]}); urllib.request.urlopen(req, timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
